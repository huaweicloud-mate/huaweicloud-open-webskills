name: opencode-triage

on:
  issues:
    types: [opened, reopened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Skip bot-authored issues
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const actor = context.payload.issue.user.login;
            const isBot = actor === 'github-actions[bot]' ||
              actor.endsWith('[bot]') ||
              context.payload.issue.user.type === 'Bot';
            return !isBot;
          result-encoding: string

      - name: Checkout repository
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        if: steps.check.outputs.result == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          prompt: |
            你是一名华为云 Web 前端技能库（SKILL.md 格式）的维护者。请分析这个新 issue，并用中文回复。

            处理步骤：
            1. 通读 issue 描述，理解问题：是技能内容错误、技能缺失、还是使用建议。
            2. 在仓库中检索对应的技能目录（huawei-cloud-web-*），确认问题涉及哪个技能。
            3. 若问题清晰且修复明确，创建新分支、修改对应 SKILL.md 并提交 PR。
            4. 若信息不足或需要更多上下文，在 issue 里用中文回复，说明分析结论、涉及技能、以及需要的补充信息；需要时给出相关文档/技能链接。
            5. 回复用中文，简洁清晰，列出下一步建议。
